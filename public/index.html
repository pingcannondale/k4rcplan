const root = document.getElementById("root"), dlg = document.getElementById("dlg");

async function call(path, opts = {}) {
  const r = await fetch(path, {
    ...opts,
    headers: { "content-type": "application/json", ...(token ? { authorization: "Bearer " + token } : {}) },
  });
  const data = await r.json().catch(() => ({}));
  if (!r.ok) throw Object.assign(new Error(data.error || "เกิดข้อผิดพลาด"), { status: r.status });
  return data;
}

/* ---------- สมัครนักกีฬานอก (เป้าหมายตายตัว: Buriram Marathon 2027 ฮาล์ฟ 23 ม.ค. 2027) ---------- */
function showReg(msg = "", v = {}) {

    <p class="muted center-tx">สมัครเพื่อรับตารางซ้อมฮาล์ฟมาราธอนที่ปรับตามเวลาของคุณ</p>
    <div class="goal-box"><b>เป้าหมายการซ้อม</b>Buriram Marathon 2027 · Half-Marathon 21.1 กม.<br>วันแข่ง 23 มกราคม 2027</div>
    <label class="l" for="rg-nick">ชื่อเล่น</label>
    <input id="rg-nick" type="text" maxlength="30" autocomplete="nickname" required value="${esc(v.nickname || "")}">

    <input id="rg-pw" type="password" autocomplete="new-password" minlength="8" required>
    <p class="hint">อย่างน้อย 8 ตัวอักษร</p>
    <label class="l" for="rg-pb">เวลาสถิติที่ดีที่สุดระยะ 5K (PB 5K)</label>
    <input id="rg-pb" type="text" inputmode="numeric" autocomplete="off" placeholder="เช่น 25:30" maxlength="8" required value="${esc(v.pb5k || "")}">
    <p class="hint">พิมพ์ตัวเลขล้วนได้ ระบบใส่ “:” ให้ เช่น 2530 = 25:30</p>
    <p class="err" role="alert">${esc(msg)}</p>
    <button class="btn primary block" type="submit">สมัครและรับตารางซ้อม</button>

  const pb = document.getElementById("rg-pb");

  document.getElementById("rb").onclick = () => showLogin();
  document.getElementById("rl").onclick = () => showLogin();
  document.getElementById("rf").onsubmit = async (e) => {
    e.preventDefault();

    try {

      token = d.token; store.set("rp_token", token);

}
function showRegDone(d) {

    <dl>

      <dt>วันแข่ง</dt><dd>23 ม.ค. 2027</dd>
      <dt>เวลาคาดการณ์</dt><dd>${esc(d.predictedHalf)}</dd>
      <dt>เพซคาดการณ์</dt><dd>${esc(d.predictedPace)} /กม.</dd>
      <dt>ตารางที่จับคู่</dt><dd>${esc(d.planLabel)}</dd>

/* ---------- เข้าสู่ระบบ ---------- */

  root.innerHTML = `<main class="lg"><div class="lg-stage">

      <p class="lg-sub">เข้าสู่ระบบเพื่อดูแผนซ้อมของคุณ</p>
      <form id="lf">
        <label class="lg-field"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg>
          <input id="em" type="email" autocomplete="username" placeholder="อีเมล" aria-label="อีเมล" required></label>
        <label class="lg-field"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="10" width="16" height="10" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>
          <input id="pw" type="password" autocomplete="current-password" placeholder="รหัสผ่าน" aria-label="รหัสผ่าน" required>
          <button class="lg-eye" type="button" id="eye" aria-label="แสดงรหัสผ่าน"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg></button></label>
        <p class="lg-hint">ลืมรหัสผ่าน? ขอรหัสใหม่จากโค้ช</p>

        <button class="lg-go" type="submit">เข้าสู่ระบบ</button>

  document.getElementById("lj").onclick = () => showReg();
  document.getElementById("eye").onclick = (e) => { const p = document.getElementById("pw"), s = p.type === "password"; p.type = s ? "text" : "password"; e.currentTarget.setAttribute("aria-label", s ? "ซ่อนรหัสผ่าน" : "แสดงรหัสผ่าน"); };
  document.getElementById("lf").onsubmit = async (e) => {
    e.preventDefault();
    const btn = e.submitter; btn.disabled = true; btn.textContent = "กำลังเข้าสู่ระบบ…";
    try {
      const d = await call("/api/login", { method: "POST", body: JSON.stringify({ email: document.getElementById("em").value, password: document.getElementById("pw").value }) });

function logout() { token = null; store.del("rp_token"); store.del("rp_cache"); plan = null; paces = null; fb = {}; skip = {}; wi = null; sel = null; tab = "home"; msgs = []; profile = null; feed = []; feedAv = {}; closeM(true); showLogin(); }

async function load() {
  root.innerHTML = `<p class="center muted">กำลังโหลด…</p>`;
  try {
    await flushQ(); // ส่งของที่ค้างตอนไม่มีเน็ตก่อน
    if (!demo && token) window.__feedP = call(feedUrl()).catch(() => null); // ดึงฟีดพร้อมแผน ไม่รอกันทีละอย่าง
    const d = await call("/api/plan");
    me = d.name; plan = d.plan; done = d.done || {}; skip = d.skip || {}; paces = d.paces || null; fb = d.feedback || {}; offline = false; msgs = d.messages || []; profile = d.profile || null; qApply();
    if (d.avatar && !store.get(avKey())) store.set(avKey(), d.avatar); else if (!d.avatar && store.get(avKey())) pushAvatar(store.get(avKey()));
    store.set("rp_cache", JSON.stringify({ name: me, plan, done, skip, paces, fb, msgs, profile, at: Date.now() }));
    render(); loadFeed(true);
    flushQ(); // ตอนต้นฟังก์ชัน me ยังว่าง จึงอ่านคิว rp_q:<ชื่อ> ไม่เจอ ต้องส่งซ้ำตรงนี้หลังรู้ชื่อแล้ว
  } catch (e) {
    if (e.status === 401) { token = null; store.del("rp_token"); store.del("rp_cache"); showLogin("เซสชันหมดอายุ กรุณาเข้าสู่ระบบใหม่"); }
    else {
      // ออฟไลน์/เน็ตหลุด: แสดงแผนที่เคยโหลดไว้ในเครื่อง (อ่านอย่างเดียว)
      let c = null; try { c = JSON.parse(store.get("rp_cache") || "null"); } catch {}
      if (c?.plan) { me = c.name; plan = c.plan; done = c.done || {}; skip = c.skip || {}; paces = c.paces || null; fb = c.fb || {}; msgs = c.msgs || []; profile = c.profile || null; offline = true; qApply(); render(); }
      else root.innerHTML = `<p class="center">${esc(e.message)}</p>`;
    }
  }
}

/* ---------- ตัวอย่าง (/?demo=1) ---------- */
function demoPlan() {
  const start = addDays(mondayOf(todayStr()), -21);
  const st = (t, u, x, p) => ({ t, u, x, p });
  const iv = (n, wu, wx, wp, ru, rx, rp) => ({ t: "repeat", n, work: { u: wu, x: wx, p: wp }, rest: { u: ru, x: rx, p: rp } });
  const T = [
    [["run", "Easy + Strides", 0, "", [st("steady", "km", 6, "lt1")], 4], ["strength", "Strength 20 นาที", 20, "", null, 5, [{ n: "สควอทขาเดียว", s: 3, r: "8/ข้าง", w: "น้ำหนักตัว" }, { n: "RDL ขาเดียว", s: 3, r: "8/ข้าง", w: "" }, { n: "ยกส้นเท้า", s: 3, r: "15", w: "" }, { n: "แพลงก์", s: 3, r: "30 วินาที", w: "" }]]],
    [["run", "Sub-threshold 4×6 นาที", 0, "ห้ามเร่งเกินเพซ LT2", [st("warmup", "km", 3, "e"), iv(4, "min", 6, "lt2", "min", 1, "e"), st("cooldown", "km", 2.5, "e")], 7]],
    [["run", "Easy run", 0, "Aerobic ล้วน ห้ามเร่ง", [st("steady", "km", 7, "lt1")], 4]],
    [["run", "Intervals 6×800 ม.", 0, "", [st("warmup", "km", 3, "e"), iv(6, "m", 800, "k5", "m", 400, "e"), st("cooldown", "km", 2, "e")], 8]],
    [["rest", "พัก", 0, "พักเต็มวัน"]],
    [["run", "Long run", 0, "พกเจล 1 ซอง ดื่มน้ำทุก 3 กม.", [st("steady", "km", 18, "lt1")], 6]],
    [["run", "Recovery jog", 0, "เบามาก คุยได้ตลอด", [st("steady", "km", 5, "e")], 3]],
  ];
  // วันพักในตัวอย่างเลื่อนตามวันจริง (ไม่ให้ตรงกับ "วันนี้" เสมอ ไม่งั้นหน้าแรกไม่มีปุ่มทำเสร็จแล้วให้ลอง)
  { const dow = (new Date(todayStr() + "T00:00:00Z").getUTCDay() + 6) % 7, rest = T.splice(4, 1)[0]; T.splice((dow + 3) % 7, 0, rest); }
  const ph = ["Base", "Base", "Build", "Build", "Build", "Peak"], fc = ["สร้างฐาน aerobic", "เพิ่มโหลด", "เริ่ม sub-threshold", "ช่วงหนัก", "ฟื้นตัว", "ช่วงหนักสุด"];
  const weeks = ph.map((phase, w) => {
    const s = addDays(start, 7 * w);
    return { weekNumber: w + 1, startDate: s, endDate: addDays(s, 6), phase, focus: fc[w], isRecoveryWeek: false,
      days: T.map((list, i) => ({ date: addDays(s, i), workouts: list.map(([sport, name, m, h, steps, rpe, ex], j) => {
        const x = { id: `d${w}${i}${j}`, sport, name, durationMinutes: m, distanceMeters: 0, humanReadable: h, description: "", primaryZone: "", rpe: rpe || 0, type: "" };
        if (ex) x.exercises = ex;
        if (steps) { x.steps = steps; const c = Steps.calc(steps, DEMO_PACES); x.durationMinutes = c.minutes; x.distanceMeters = c.meters; }
        return x;
      }) })) };
  });
  return { meta: { event: "ฮาล์ฟมาราธอน เป้า sub 1:30", eventDate: addDays(start, 7 * 14), planStartDate: start, planEndDate: addDays(start, 41) }, weeks };
}
// ตัวอย่างประวัติที่ทำแล้ว (วันที่ผ่านมา) เพื่อให้กราฟสถิติมีข้อมูล เว้น 2 เวิร์คเอาต์ให้เป็น "ไม่ได้ทำ"
function seedDemo() {
  const today = todayStr(); let skipped = 0;
  plan.weeks.forEach((w) => w.days.forEach((d) => d.workouts.forEach((x) => {
    if (x.sport === "rest" || d.date >= today) return;
    if (x.name.startsWith("Intervals") && skipped < 2 && d.date < addDays(today, -7)) { if (!skipped) skip[x.id] = 1; skipped++; return; }
    done[x.id] = 1;
    fb[x.id] = { rpe: Math.max(1, (x.rpe || 5) + (x.id.length % 2 ? 0 : 1)), feel: 3 + (x.id.length % 3 === 0 ? 1 : 0), pain: false, note: x.name.startsWith("Long") ? "ช่วง 3 กม.สุดท้ายเหนื่อย แต่จบได้ดี" : "", at: d.date + "T10:00:00Z" };
  })));
}
const DEMO_PACES = { values: { e: "6:31-7:31", lt1: "5:56-6:31", lt2: "4:57", marathon: "5:16", k5: "4:40", vo2max: "4:33", r: "4:18" }, note: "ตัวอย่าง: โค้ชจะเป็นคนกรอกเพซจริงให้", updatedAt: new Date().toISOString() };

/* ---------- ตัวช่วยคำนวณ ---------- */
const hasPaceVal = () => !!paces && PACES.some((p) => paces.values?.[p.k]);
function wcalc(x) {
  const c = x.steps?.length ? Steps.calc(x.steps, paces) : null;
  const ok = !!c && c.ok;
  return { c, min: ok ? c.minutes : +x.durationMinutes || 0, m: ok ? c.meters : +x.distanceMeters || 0 };
}
const trainOf = (d) => d.workouts.filter((x) => x.sport !== "rest");
const dayKm = (d) => trainOf(d).reduce((s, x) => s + wcalc(x).m, 0) / 1000;
function wkStats(w) {
  const all = w.days.flatMap((d) => trainOf(d));
  const dn = all.filter((x) => done[x.id]);
  const km = (l) => l.reduce((s, x) => s + wcalc(x).m, 0) / 1000;
  return { n: all.length, doneN: dn.length, planKm: km(all), doneKm: km(dn) };
}
const clockMin = (m) => (m >= 100 ? `${Math.floor(m / 60)}:${pad(m % 60)}` : `${m}`);
const clockUnit = (m) => (m >= 100 ? "ชม." : "นาที");
const num = (v, u) => `<div><span class="nv">${v}</span><span class="nu"> ${u}</span></div>`;

/* ---------- วาดหน้า ---------- */
/* ---------- สถานะ ไอคอน ตัวช่วย ---------- */
const SVG = (d, w = 3.5) => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="${d}"/></svg>`;
const ICON = { done: SVG("M5 12.5l4.5 4.5L19 7.5"), missed: SVG("M6 6l12 12M18 6L6 18"), today: `<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4.5" fill="currentColor"/></svg>`, planned: "", rest: "" };
let INDEX = {};
const loadOf = (x) => Perf.workoutLoad(wcalc(x).min, fb[x.id]?.rpe || x.rpe);
function findW(id) { for (const w of plan?.weeks || []) for (const d of w.days) for (const x of d.workouts) if (x.id === id) return x; return null; }
function workoutBody(x) {
  const on = !!done[x.id], { c, min, m } = wcalc(x);
  const refs = c ? [...new Set(c.segs.filter((s) => s.ref && s.type !== "rest").map((s) => s.ref))] : [];
  const chips = refs.map((r) => `<span class="cp">${Steps.REF_LABEL[r]}${paces?.values?.[r] ? " " + esc(paceText(paces.values[r])) : ""}</span>`)
    .concat(!c && x.targetPace ? [`<span class="cp">${esc(x.targetPace.low)}${x.targetPace.high && x.targetPace.high !== x.targetPace.low ? "–" + esc(x.targetPace.high) : ""} /กม.</span>`] : [])
    .concat(x.primaryZone ? [`<span class="cp mut">${esc(x.primaryZone)}</span>`] : []);
  const miss = c?.missing?.map((r) => Steps.REF_LABEL[r]) || [];
  return `<div class="nums">${m ? num(+(m/1000).toFixed(1), "กม.") : ""}${min ? num(clockMin(min), clockUnit(min)) : ""}${x.rpe ? num(x.rpe, "RPE แผน") : ""}</div>
    ${c ? stepGraph(c.segs, "กราฟโครงสร้างการซ้อม") + stepRows(x.steps, paces) : ""}
    ${miss.length ? `<p class="warn">โค้ชยังไม่ได้ตั้งเพซ ${esc(miss.join(", "))} ตัวเลขเวลาและกราฟยังไม่ครบ</p>` : ""}
    ${x.exercises?.length ? `<div class="srows" role="list">${x.exercises.map((e) => `<div class="srow" role="listitem"><div><b>${esc(e.n)}</b>${e.w ? `<div class="sub">${esc(e.w)}</div>` : ""}</div><span class="sv">${esc(Steps.exAmount(e))}</span></div>`).join("")}</div>` : ""}
    ${chips.length ? `<div class="chipsP">${chips.join("")}</div>` : ""}
    ${x.description ? `<p class="wtx">${esc(x.description)}</p>` : ""}${x.humanReadable ? `<p class="wtx">${esc(x.humanReadable)}</p>` : ""}
    ${on ? fbLine(fb[x.id]) : ""}`;
}
const fmtHM = (min) => `${Math.floor(min / 60)}:${pad(Math.round(min) % 60)}`;
// รูปโปรไฟล์: เก็บในเครื่อง (ย่อเป็นสี่เหลี่ยมจัตุรัส 256px) ไม่ต้องอัปโหลดขึ้นเซิร์ฟเวอร์
const avKey = () => "rp_avatar:" + me;

async function loadFeed(force) { // force = รีเฟรชทันที (หลังบันทึกผล/อัปโหลดรูป/เปิดแอป) ที่เหลือ (สลับแท็บ กลับเข้าแอป) ไม่ยิงซ้ำภายใน 45 วินาที ลดจำนวนครั้งที่เรียกฟังก์ชัน
  if (demo || offline || !token) return;

    for (const [id, img] of Object.entries(d.avatars || {})) c[id] = { h: d.avh?.[id], img };

/* คิวส่งผลซ้อมตอนไม่มีเน็ต: เก็บในเครื่อง แล้วส่งให้เองเมื่อกลับมาออนไลน์ (รายการล่าสุดของแต่ละเวิร์คเอาต์เท่านั้น) */
const qKey = () => "rp_q:" + me;
const qGet = () => { try { return JSON.parse(store.get(qKey()) || "[]"); } catch { return []; } };
const qPush = (body) => { const q = qGet().filter((x) => x.workoutId !== body.workoutId); q.push(body); try { store.set(qKey(), JSON.stringify(q.slice(-40))); } catch {} };
function qApply() { for (const it of qGet()) { if ("skip" in it && !("done" in it)) { it.skip ? (skip[it.workoutId] = 1) : delete skip[it.workoutId]; } else if (it.done) { done[it.workoutId] = 1; delete skip[it.workoutId]; if (it.fb) fb[it.workoutId] = { ...it.fb, at: new Date().toISOString() }; } else { delete done[it.workoutId]; delete fb[it.workoutId]; } } }
let flushing = false;
async function flushQ() {
  if (demo || !token || flushing) return; const q = qGet(); if (!q.length) return; flushing = true;
  const rest = []; for (const it of q) { try { await call("/api/done", { method: "POST", body: JSON.stringify(it) }); } catch (e) { if (!e.status || e.status >= 500) rest.push(it); } }
  try { store.set(qKey(), JSON.stringify(rest)); } catch {} flushing = false;
  if (rest.length < q.length && !offline) loadFeed(true);
}
window.addEventListener("online", async () => { await flushQ(); if (offline) load(); else loadFeed(true); });
function toast(msg, act) { // ข้อความสั้น ๆ ลอยเหนือแถบเมนู act = [ชนิดปุ่ม, โมดอล, ค่า, ข้อความปุ่ม]

  t.innerHTML = `<span>${esc(msg)}</span>${act ? `<button type="button" data-act="${act[0]}" data-m="${act[1]}" data-v="${esc(act[2])}">${esc(act[3])}</button>` : ""}`;
  document.body.appendChild(t); t.addEventListener("click", () => t.remove()); clearTimeout(toast._t);
  toast._t = setTimeout(() => { t.classList.add("out"); setTimeout(() => t.remove(), 280); }, 6500);
}
async function setSkip(id, on) {

  try { await call("/api/done", { method: "POST", body: JSON.stringify(body) }); flushQ(); }
  catch (e) {

  }
}
async function setDone(id, on, fbObj) {

  if (on) { done[id] = 1; delete skip[id]; if (fbObj !== undefined) fbObj && (fbObj.rpe || fbObj.feel || fbObj.pain || fbObj.note || fbObj.km || fbObj.min) ? (fb[id] = { ...fbObj, at: new Date().toISOString() }) : delete fb[id]; }

  if (offline) { qPush(body); return toast("ออฟไลน์ บันทึกไว้ในเครื่องแล้ว จะส่งให้เมื่อมีเน็ต"); }

  catch (e) {
    if (!e.status || e.status >= 500) { qPush(body); return toast("เน็ตหรือระบบไม่พร้อม บันทึกไว้ในเครื่องแล้ว จะส่งให้อัตโนมัติ"); }

const pfGet = () => { try { return { ...PF_DEF, ...JSON.parse(store.get("rp_pf:" + me) || "{}") }; } catch { return { ...PF_DEF }; } };
function athStats(weeks, today) {
  const all = weeks.flatMap((w) => w.days.flatMap((d) => trainOf(d))), dn = all.filter((x) => done[x.id]);
  let run = 0, best = 0;
  weeks.forEach((w, i) => {
    if (i > CUR) return;
    const items = w.days.flatMap((d) => trainOf(d).map((x) => ({ x, date: d.date }))); if (!items.length) return;
    if (i < CUR) { if (items.every((o) => done[o.x.id])) { run++; best = Math.max(best, run); } else run = 0; }
    else { const due = items.filter((o) => o.date <= today); if (due.length && due.every((o) => done[o.x.id])) { run++; best = Math.max(best, run); } }
  });
  return { n: dn.length, km: dn.reduce((s, x) => s + kmOf(x), 0), maxKm: Math.max(0, ...dn.map(kmOf)), perfect: weeks.filter((w) => { const t = wkStats(w); return t.n && t.doneN === t.n; }).length, cur: run, best };
}
const MEDALS = [["ก้าวแรก", (s) => s.n >= 1], ["10 ครั้ง", (s) => s.n >= 10], ["50 ครั้ง", (s) => s.n >= 50], ["50 กม.", (s) => s.km >= 50], ["100 กม.", (s) => s.km >= 100], ["250 กม.", (s) => s.km >= 250],

const cells = (a) => `<div class="ak-cells">${a.map(([v, l]) => `<div class="ak-cell"><b>${esc(v)}</b><span>${l}</span></div>`).join("")}</div>`;

  if (pf.goal) {

      ${prs.length ? `<div class="ak-h" style="margin-top:12px">สถิติส่วนตัว</div>${cells(prs)}` : ""}</section>`);
  }
  if (pf.body) {

}

};
async function saveProfile() {
  const v = (k) => dlg.querySelector("#pf-" + k).value.trim(), err = dlg.querySelector("#pf-err"), num = (k, lo, hi, name) => { const t = v(k); if (!t) return ""; const x = Number(t); if (!(x >= lo && x <= hi)) throw new Error(`${name} ควรอยู่ระหว่าง ${lo}–${hi}`); return x; };
  const tm = (k, name) => { const t = v(k); if (t && !/^\d{1,2}(:\d{2}){1,2}$/.test(t)) throw new Error(`${name} ใส่เป็นรูปแบบ 25:30 หรือ 1:55:00`); return t; };
  try {
    const body = { age: num("age", 5, 100, "อายุ"), weight: num("weight", 20, 250, "น้ำหนัก"), hrMax: num("hrMax", 100, 250, "ชีพจรสูงสุด"), hrRest: num("hrRest", 25, 120, "ชีพจรพัก"), goal: tm("goal", "เวลาเป้าหมาย"), feedOff: dlg.querySelector("#pf-feed")?.getAttribute("aria-pressed") !== "true", pr: { k5: tm("k5", "PR 5K"), k10: tm("k10", "PR 10K"), k21: tm("k21", "PR 21K"), k42: tm("k42", "PR 42K") } };
    if (demo) { const c = {}; for (const k of ["age", "weight", "hrMax", "hrRest", "goal"]) if (body[k]) c[k] = body[k]; if (body.feedOff) { c.feedOff = true; feed = feed.filter((p) => !p.me); } const pr = Object.fromEntries(Object.entries(body.pr).filter(([, x]) => x)); if (Object.keys(pr).length) c.pr = pr; profile = Object.keys(c).length ? c : null; }
    else profile = (await call("/api/profile", { method: "POST", body: JSON.stringify(body) })).profile;
    closeM(); render();
  } catch (e) { if (err) err.textContent = e.message || "บันทึกไม่สำเร็จ"; }
}

  else if (a === "shgo") shareImg("share");
