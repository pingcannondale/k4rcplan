<!doctype html>
<html lang="th" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">

<title>โค้ช · K4RC Training Plan</title>
<meta name="theme-color" content="#202124">
<meta name="application-name" content="K4RC Training Plan">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="K4RC Training Plan">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32-v5.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon-v5.png">
<link rel="preload" href="fonts/plus-jakarta-sans-latin-600-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/prompt-thai-500-normal.woff2" as="font" type="font/woff2" crossorigin>
<script src="theme.js"></script>
<link rel="stylesheet" href="app.css">

<link rel="stylesheet" href="ios27.css">

</head>
<body class="coach">
<main class="adm" id="root"></main>
<dialog id="wdlg" aria-labelledby="wdlg-title"></dialog>
<div id="toast" class="toast" role="status" hidden></div>
<script src="common.js"></script>
<script src="steps.js"></script>
<script src="vdot.js"></script>
<script>
addEventListener("click", (e) => { if (e.target.closest("[data-act=install]")) installApp(); });
document.documentElement.dataset.theme = "light"; store.del("rp_theme");
let pw = "", athletes = [], cur = "", tab = "dash", plan = null, week = mondayOf(todayStr()), draft = null, dirty = false, doneMap = {}, fbMap = {}, openIJ = null, advOpen = false;
let shareSel = new Set(), shareScope = "all";
try { pw = sessionStorage.getItem("pw") || ""; } catch {}
const $ = (s) => document.querySelector(s);
const root = $("#root");
const SPORTS = ["run", "strength", "rest", "race", "bike", "swim", "brick"];

function toast(msg, bad) {
  const t = $("#toast");
  t.textContent = msg; t.className = "toast" + (bad ? " bad" : ""); t.hidden = false;
  clearTimeout(toast.t); toast.t = setTimeout(() => (t.hidden = true), 4000);
}
async function api(action, body = {}) {
  const r = await fetch("/api/admin", {
    method: "POST",
    headers: { "content-type": "application/json", "x-admin-password": pw },
    body: JSON.stringify({ action, ...body }),
  });
  const data = await r.json().catch(() => ({}));
  if (!r.ok) throw Object.assign(new Error(data.error || "เกิดข้อผิดพลาด"), { status: r.status });
  return data;
}
const guard = () => { if (dirty && !confirm("ยังไม่ได้บันทึก ทิ้งการแก้ไขนี้ไหม?")) return false; dirty = false; return true; };
const genPw = () => { const c = "abcdefghjkmnpqrstuvwxyz23456789"; return Array.from(crypto.getRandomValues(new Uint8Array(8)), (n) => c[n % c.length]).join(""); };

/* ---------- เข้าสู่ระบบโค้ช ---------- */
function renderLogin(msg) {
  root.innerHTML = `<form class="login-card" id="lf" style="margin:12vh auto 0"><i class="logo" role="img" aria-label="K4RC Training Plan"></i><h1 class="brand center-tx" style="font-size:1.5rem">เข้าสู่ระบบโค้ช</h1>
    <label class="l" for="apw">รหัสผ่านโค้ช</label><input id="apw" type="password" autocomplete="current-password" required>
    <p class="err" role="alert">${esc(msg || "")}</p><button class="btn primary block" type="submit">เข้าสู่ระบบ</button></form>`;
  $("#lf").onsubmit = (e) => { e.preventDefault(); pw = $("#apw").value; boot(); };
}
async function boot() {
  try {
    athletes = (await api("athletes")).athletes;
    try { sessionStorage.setItem("pw", pw); } catch {}
    cur = cur || athletes[0]?.id || "";
    renderMain();
  } catch (e) {
    if (e.status === 401) { pw = ""; try { sessionStorage.removeItem("pw"); } catch {} }
    renderLogin(e.message);
  }
}
function logout() { pw = ""; try { sessionStorage.removeItem("pw"); } catch {} renderLogin(); }

/* ---------- โครงหลัก ---------- */
const TABS_C = [
  ["dash", "ภาพรวม", '<rect x="3.5" y="3.5" width="7" height="9" rx="2"/><rect x="13.5" y="3.5" width="7" height="5" rx="2"/><rect x="13.5" y="11.5" width="7" height="9" rx="2"/><rect x="3.5" y="15.5" width="7" height="5" rx="2"/>'],
  ["ath", "นักกีฬา", '<circle cx="9" cy="8" r="3.2"/><path d="M3.5 20c.5-3.5 3-5.5 5.5-5.5s5 2 5.5 5.5M16 5.2a3.2 3.2 0 0 1 0 5.8M17.5 14.8c1.8.6 3 2.4 3.3 5.2"/>'],
  ["ext", "นักกีฬานอก", '<circle cx="12" cy="12" r="8.5"/><path d="M3.5 12h17M12 3.5c2.4 2.4 3.6 5.2 3.6 8.5s-1.2 6.1-3.6 8.5c-2.4-2.4-3.6-5.2-3.6-8.5s1.2-6.1 3.6-8.5z"/>'],
  ["plan", "แผนซ้อม", '<rect x="3.5" y="5" width="17" height="15.5" rx="3"/><path d="M8 3v4M16 3v4M3.5 10h17"/>']];
const XHEAD = { dash: ["ภาพรวม", "ภาพรวมโค้ช"], ath: ["จัดการบัญชี", "นักกีฬา"], ext: ["สมัครเองผ่านปุ่ม “สร้างบัญชี” ในหน้าเข้าสู่ระบบ", "นักกีฬานอก"], plan: ["ปฏิทินของนักกีฬา", "แผนซ้อม"] };
function renderMain() {
  const h = XHEAD[tab];
  root.innerHTML = `<nav class="xcn" aria-label="เมนูโค้ช"><div class="xbrand"><img src="icons/icon-192-v5.png" alt="" width="44" height="44"><div><b>K4RC Training Plan</b><span>ระบบโค้ช</span></div></div>
    <div class="tabs" role="tablist" aria-label="เมนูโค้ช" style="--i:${TABS_C.findIndex((x) => x[0] === tab)}"><i class="ind" aria-hidden="true"></i>
      ${TABS_C.map(([k, l, ic]) => `<button role="tab" aria-selected="${tab === k}" aria-label="${l}" onclick="setTab('${k}')"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true">${ic}</svg><span class="lbl">${l}${k === "ath" ? ` (${athletes.length})` : k === "ext" ? ` (${athletes.filter((a) => a.external).length})` : ""}</span></button>`).join("")}
    </div><div class="xcn-f"><div class="thm-row">${k4Theme.seg()}</div>${installBtn("btn sm")}<button class="xout" onclick="logout()">ออกจากระบบ</button></div></nav>
    <div class="xhead"><i class="hlogo" role="img" aria-label="K4RC"></i><p class="xm">${h[0]}</p><h1>${h[1]}${tab === "ath" ? ` (${athletes.length})` : tab === "ext" ? ` (${athletes.filter((a) => a.external).length})` : ""}</h1><div class="thm-top">${k4Theme.seg()}</div></div>
    <section class="panel${tab === "ath" ? " narrow" : ""}" id="panel"></section>`;
  tab === "dash" ? loadDash() : tab === "ath" ? renderAthletes() : tab === "ext" ? loadExt() : loadPlan();
}
function setTab(t) { if (!guard()) return; if (t !== tab && wdlg.open) closeW(); tab = t; renderMain(); }
async function refresh() { athletes = (await api("athletes")).athletes; if (!athletes.some((a) => a.id === cur)) cur = athletes[0]?.id || ""; renderMain(); }

/* ---------- แท็บนักกีฬา ---------- */
function renderAthletes() {
  $("#panel").classList.add("narrow");
  $("#panel").innerHTML = `
    <h2>สร้างบัญชีนักกีฬา</h2>
    <div class="addrow">
      <input id="nn" placeholder="ชื่อ" aria-label="ชื่อนักกีฬาใหม่">
      <input id="ne" type="email" placeholder="อีเมลที่ใช้ล็อกอิน" aria-label="อีเมลนักกีฬาใหม่">
      <div class="pwrow"><input id="np" placeholder="รหัสผ่าน (6 ตัวขึ้นไป)" aria-label="รหัสผ่านนักกีฬาใหม่"><button class="btn" onclick="$('#np').value=genPw()">สุ่ม</button></div>
      <button class="btn primary" onclick="saveA()">สร้าง</button></div>
    <p class="prog" style="margin-top:.5rem">จดอีเมลกับรหัสผ่านส่งให้นักกีฬาเอง ระบบเก็บรหัสแบบเข้ารหัส ดูย้อนหลังไม่ได้ ถ้าลืมให้ตั้งรหัสใหม่</p>
    <h2>รายชื่อ</h2>
    ${athletes.length ? athletes.map((a) => `<div class="arow">
      <input id="n-${a.id}" value="${esc(a.name)}" aria-label="ชื่อ">
      <input id="e-${a.id}" type="email" value="${esc(a.email)}" aria-label="อีเมล">
      <div class="pwrow"><input id="p-${a.id}" placeholder="${a.hasPassword ? "รหัสใหม่ (เว้นว่าง = ไม่เปลี่ยน)" : "ยังไม่ได้ตั้งรหัสผ่าน"}" aria-label="รหัสผ่านใหม่"><button class="btn" onclick="$('#p-${a.id}').value=genPw()">สุ่ม</button></div>
      ${a.external ? `<div class="prog"><span class="bd">นักกีฬานอก</span> PB 5K ${esc(a.ext.pb5k)} · ฮาล์ฟคาดการณ์ ${esc(a.ext.predictedHalf)} (${esc(a.ext.predictedPace)}/กม.) · ${esc(a.ext.planLabel)}</div>` : ""}
      <div class="prog">${a.event ? `แผน: ${esc(a.event)} · ทำแล้ว ${a.done}/${a.total}` : "ยังไม่มีแผน"}</div>
      <details><summary>เพซของ ${esc(a.name)} ${a.paces ? `<span class="prog">· ตั้งแล้ว ${PACES.filter((p) => a.paces.values[p.k]).length}/${PACES.length}</span>` : `<span class="prog">· ยังไม่ได้ตั้ง</span>`}</summary>
        <div class="calc"><div class="m-sec" style="margin:0;font-size:.85rem">ตัวช่วยคำนวณเพซจากเวลาแข่งล่าสุด (เติมให้ทุกช่อง แล้วโค้ชแก้ต่อได้)</div>
          <div class="r"><select id="cd-${a.id}" aria-label="ระยะแข่ง"><option value="5k">5 กม.</option><option value="10k">10 กม.</option><option value="half">ฮาล์ฟมาราธอน</option><option value="full">มาราธอน</option></select>
            <input id="ct-${a.id}" placeholder="เวลา เช่น 23:20 หรือ 1:45:00" aria-label="เวลาแข่ง" inputmode="numeric"><button class="btn sm" onclick="calcPaces('${a.id}')">คำนวณ</button></div>
          <div class="res" id="cr-${a.id}" role="status"></div></div>
        <div class="pace-grid">${PACES.map((p) => `<label>${p.label}<input id="pc-${p.k}-${a.id}" value="${esc(a.paces?.values[p.k] || "")}" placeholder="เช่น 5:30 หรือ 5:15-5:45" aria-label="เพซ ${p.label} ของ ${esc(a.name)}" maxlength="24"></label>`).join("")}</div>
        <label class="l" for="pn-${a.id}" style="margin-top:0">หมายเหตุถึงนักกีฬา (ไม่บังคับ)</label>
        <input id="pn-${a.id}" value="${esc(a.paces?.note || "")}" placeholder="เช่น ทดสอบเมื่อ ต.ค. 2569" maxlength="200">
        <p class="prog" style="margin:.4rem 0">ใส่เป็นนาที/กม. ระบบต่อท้าย "/กม." ให้เอง เว้นว่างทุกช่อง = ลบเพซของคนนี้</p>
        <button class="btn primary" onclick="savePaces('${a.id}')">บันทึกเพซ</button></details>
      ${a.profile ? `<details><summary>ข้อมูลของ ${esc(a.name)} <span class="prog">· นักกีฬากรอกเอง</span></summary><div class="prog" style="line-height:1.8">${profLine(a.profile)}</div></details>` : ""}
      <details><summary>ข้อความถึง ${esc(a.name)} <span class="prog">· ${a.messages?.length ? `ส่งล่าสุด ${a.messages.length} ข้อความ` : "ยังไม่มี"}</span></summary>
        <label class="l" for="mg-${a.id}" style="margin-top:0">ข้อความที่นักกีฬาจะเห็นที่ปุ่มข้อความบนหน้าแรกของแอป</label>
        <textarea id="mg-${a.id}" rows="3" maxlength="500" placeholder="เช่น สัปดาห์นี้ลดความหนักลงนะ ถ้าขาตึงให้พักเต็มที่"></textarea>
        <button class="btn primary" style="margin-top:.5rem" onclick="sendMsg('${a.id}')">ส่งข้อความ</button>
        ${(a.messages || []).map((m) => `<div class="prog" style="margin-top:.6rem">${esc(msgTime(m.at))} · ${esc(m.text)} <button class="btn sm danger" onclick="delMsg('${a.id}','${m.id}')">ลบ</button></div>`).join("")}</details>
      <div class="btns"><button class="btn" onclick="saveA('${a.id}')">บันทึก</button><button class="btn danger" onclick="delA('${a.id}')">ลบ</button></div></div>`).join("") : `<p class="notice">ยังไม่มีนักกีฬา</p>`}
    <h2>สำรอง / กู้คืนข้อมูลทั้งระบบ</h2>
    <p class="prog">ดาวน์โหลดนักกีฬา แผน เพซ ประวัติการติ๊กทำแล้ว และความรู้สึกหลังซ้อมทั้งหมดเป็นไฟล์เดียว เก็บไว้ในเครื่องหรือ Google Drive ได้</p>
    <label class="chk"><input type="checkbox" id="bk-login" checked> รวมรหัสผ่านแบบเข้ารหัส (กู้คืนแล้วนักกีฬาล็อกอินได้เหมือนเดิม) · เก็บไฟล์นี้ให้ปลอดภัย</label>
    <div class="btns" style="margin-top:.6rem"><button class="btn primary" onclick="exportAll()">ดาวน์โหลด backup ทั้งหมด</button>
      <label class="btn" style="cursor:pointer">กู้คืนจากไฟล์ backup<input type="file" accept=".json,application/json" hidden onchange="restoreFile(this)"></label></div>`;
}
async function saveA(id) {
  const g = (p) => (id ? $(`#${p}-${id}`) : $(`#${{ n: "nn", e: "ne", p: "np" }[p]}`)).value;
  try {
    await api("saveAthlete", { id, name: g("n"), email: g("e"), password: g("p") });
    toast(id ? "บันทึกแล้ว" : "สร้างบัญชีแล้ว อย่าลืมส่งอีเมลกับรหัสผ่านให้นักกีฬา");
    await refresh();
  } catch (e) { toast(e.message, 1); }
}
async function savePaces(id) {
  const values = {}; for (const p of PACES) values[p.k] = $(`#pc-${p.k}-${id}`).value;
  try {
    const r = await api("savePaces", { id, values, note: $(`#pn-${id}`).value });
    toast(r.paces ? "บันทึกเพซแล้ว" : "ลบเพซของคนนี้แล้ว");
    athletes = (await api("athletes")).athletes; renderAthletes();
    document.querySelector(`#pc-e-${id}`)?.closest("details")?.setAttribute("open", "");
  } catch (e) { toast(e.message, 1); }
}
const profLine = (p) => [p.age ? `อายุ ${p.age} ปี` : "", p.weight ? `น้ำหนัก ${p.weight} กก.` : "", p.hrMax ? `HR สูงสุด ${p.hrMax}` : "", p.hrRest ? `HR พัก ${p.hrRest}` : "", p.goal ? `เวลาเป้าหมาย ${p.goal}` : "",
  ...[["k5", "5K"], ["k10", "10K"], ["k21", "21K"], ["k42", "42K"]].filter(([k]) => p.pr?.[k]).map(([k, l]) => `PR ${l} ${p.pr[k]}`)].filter(Boolean).map(esc).join(" · ");
const msgTime = (iso) => { const d = new Date(iso); return `${d.getDate()} ${MONTHS[d.getMonth()]} ${pad(d.getHours())}:${pad(d.getMinutes())}`; };
async function sendMsg(id) {
  const text = $(`#mg-${id}`).value.trim(); if (!text) return toast("พิมพ์ข้อความก่อนส่ง", 1);
  try {
    await api("sendMessage", { id, text }); toast("ส่งข้อความแล้ว นักกีฬาจะเห็นเมื่อเปิดแอป");
    athletes = (await api("athletes")).athletes; renderAthletes();
    document.querySelector(`#mg-${id}`)?.closest("details")?.setAttribute("open", "");
  } catch (e) { toast(e.message, 1); }
}
async function delMsg(id, mid) {
  try {
    await api("deleteMessage", { id, mid }); toast("ลบข้อความแล้ว");
    athletes = (await api("athletes")).athletes; renderAthletes();
    document.querySelector(`#mg-${id}`)?.closest("details")?.setAttribute("open", "");
  } catch (e) { toast(e.message, 1); }
}
async function exportAll() {
  try {
    const r = await api("exportAll", { withLogins: $("#bk-login").checked });
    downloadJSON(r.backup, `k4rc-backup-${todayStr()}.json`);
    toast(`ดาวน์โหลด backup แล้ว (${r.backup.athletes.length} คน)`);
  } catch (e) { toast(e.message, 1); }
}
async function restoreFile(inp) {
  const f = inp.files[0]; inp.value = ""; if (!f) return;
  let bk; try { bk = JSON.parse(await f.text()); } catch { return toast("อ่านไฟล์ไม่ได้ ต้องเป็นไฟล์ .json ที่ดาวน์โหลดจากปุ่ม backup", 1); }
  if (bk?.app !== "k4rc-training-plan" || !Array.isArray(bk.athletes)) return toast("ไม่ใช่ไฟล์ backup ทั้งระบบของ K4RC Training Plan", 1);
  if (!confirm(`กู้คืนจากไฟล์ backup (${bk.athletes.length} คน, สำรองเมื่อ ${String(bk.exportedAt || "").slice(0, 10) || "ไม่ทราบ"})?\n\nคนที่มีรหัสเดียวกันจะถูกอัปเดตด้วยข้อมูลในไฟล์ (แผนและประวัติจะถูกแทนที่) คนที่ไม่อยู่ในไฟล์จะไม่ถูกลบ`)) return;
  try {
    const r = await api("restoreAll", { backup: bk });
    toast(`กู้คืนแล้ว: เพิ่ม ${r.added} · อัปเดต ${r.updated} · แผน ${r.plans}${r.skipped ? ` · ข้าม ${r.skipped}` : ""}`);
    await refresh();
  } catch (e) { toast(e.message, 1); }
}
async function delA(id) {
  const a = athletes.find((x) => x.id === id);
  if (!confirm(`ลบ ${a.name} พร้อมแผนและประวัติทั้งหมด? ย้อนกลับไม่ได้`)) return;
  try { await api("deleteAthlete", { id }); toast("ลบแล้ว"); await refresh(); } catch (e) { toast(e.message, 1); }
}

/* ---------- แท็บแผนซ้อม ---------- */
async function loadPlan() {
  const panel = $("#panel");
  if (!athletes.length) { panel.innerHTML = `<p class="notice">สร้างบัญชีนักกีฬาที่แท็บ "นักกีฬา" ก่อน</p>`; return; }
  try { const r = await api("getPlan", { id: cur }); plan = r.plan; doneMap = r.done || {}; fbMap = r.feedback || {}; } catch (e) { toast(e.message, 1); plan = null; doneMap = {}; fbMap = {}; }
  if (plan && !plan.weeks.some((w) => w.startDate === week)) { const t = mondayOf(todayStr()); week = plan.weeks.some((w) => w.startDate === t) ? t : plan.weeks[0].startDate; }
  loadDraft(); renderPlan();
}
function loadDraft() {
  const w = plan?.weeks.find((x) => x.startDate === week);
  draft = w ? JSON.parse(JSON.stringify(w)) : { startDate: week, phase: "", focus: "", days: Array.from({ length: 7 }, (_, i) => ({ date: addDays(week, i), workouts: [] })) };
  dirty = false;
}
function planMgmtHtml(exists) {
  return `${plan ? `<div class="two"><div><label class="l" for="pe" style="margin-top:0">ชื่อเป้าหมาย / งานแข่ง</label><input id="pe" value="${esc(plan.meta.event)}"></div>
      <div><label class="l" for="pd" style="margin-top:0">วันแข่ง</label><input id="pd" type="date" value="${plan.meta.eventDate}"></div></div>
      <p class="prog" style="margin:.4rem 0">${plan.weeks.length} สัปดาห์ · ${shortDate(plan.meta.planStartDate)} ถึง ${shortDate(plan.meta.planEndDate)}</p>`
      : `<p class="prog">ยังไม่มีแผน นำเข้าไฟล์ หรือเพิ่มเวิร์คเอาต์ในปฏิทินแล้วกด บันทึกสัปดาห์นี้</p>`}
    <div class="btns">
      <label class="btn" style="cursor:pointer">นำเข้าไฟล์แผน (.html / .json)<input type="file" accept=".html,.json,application/json,text/html" hidden onchange="importFile(this)"></label>

function calcPaces(id) {
  const r = Vdot.suggest($(`#cd-${id}`).value, $(`#ct-${id}`).value), out = $(`#cr-${id}`);

  PACES.forEach((p) => ($(`#pc-${p.k}-${id}`).value = r.values[p.k]));
  out.style.color = ""; out.textContent = `VDOT ${r.vdot.toFixed(1)} เติมให้ทุกช่องแล้ว เป็นค่าประมาณ ปรับตามนักกีฬาได้ แล้วกด "บันทึกเพซ"`;

    <div class="tpl"><button class="btn sm" onclick="addS(${i},${j},'warmup')">+ วอร์มอัพ</button><button class="btn sm" onclick="addS(${i},${j},'steady')">+ วิ่งต่อเนื่อง</button><button class="btn sm" onclick="addS(${i},${j},'repeat')">+ อินเทอร์วัล</button><button class="btn sm" onclick="addS(${i},${j},'cooldown')">+ คูลดาวน์</button></div>
    <div class="pv" id="pv-${i}-${j}">${previewHtml(w)}</div>
    <button class="btn sm danger" onclick="clearSteps(${i},${j})">ยกเลิกโครงสร้าง (กรอกเวลา/ระยะเอง)</button></div>`;
}
// อัปเดตกราฟ/ยอดรวม และช่องเวลา-ระยะของเวิร์คเอาต์ โดยไม่วาดฟอร์มใหม่ (กันช่องกรอกเสียโฟกัสตอนพิมพ์)
function updatePv(i, j) {
  const w = draft.days[i].workouts[j], c = Steps.calc(w.steps, athPaces());
  if (c.ok) { w.durationMinutes = c.minutes; w.distanceMeters = c.meters; }
  const pv = $(`#pv-${i}-${j}`); if (pv) pv.innerHTML = previewHtml(w);
  const dm = $(`#dm-${i}-${j}`), dk = $(`#dk-${i}-${j}`);
  if (dm) dm.value = w.durationMinutes || ""; if (dk) dk.value = w.distanceMeters ? +(w.distanceMeters / 1000).toFixed(2) : "";
}
function setS(i, j, k, sub, f, v, redraw) {
  const w = draft.days[i].workouts[j], st = stepOf(w, k, sub);
  st[f] = f === "x" ? Math.max(0, +v || 0) : f === "n" ? Math.max(1, Math.min(50, Math.round(+v) || 1)) : v;
  dirty = true; redraw ? (updatePv(i, j), drawEditors()) : updatePv(i, j);
}
function setPace(i, j, k, sub, v) {
  const st = stepOf(draft.days[i].workouts[j], k, sub);
  st.p = v === "custom" ? "5:00" : v; dirty = true; updatePv(i, j); drawEditors();
}
function addS(i, j, t) {
  const w = draft.days[i].workouts[j];
  w.steps.push(t === "repeat" ? RP(4, "min", 6, "lt2", "min", 1, "e") : S1(t, "km", t === "steady" ? 5 : 2, t === "steady" ? "lt1" : "e"));
  dirty = true; updatePv(i, j); drawEditors();
}
function delS(i, j, k) { const w = draft.days[i].workouts[j]; w.steps.splice(k, 1); if (!w.steps.length) delete w.steps; dirty = true; if (w.steps) updatePv(i, j); drawEditors(); }
function clearSteps(i, j) { delete draft.days[i].workouts[j].steps; dirty = true; drawEditors(); }
function tpl(i, j, id) {
  const t = TPL.find((x) => x.id === id), w = draft.days[i].workouts[j];
  if (w.steps?.length && !confirm("แทนที่ขั้นตอนที่กรอกไว้ด้วยแบบนี้?")) return;
  w.steps = t.steps(); if (!w.name) w.name = t.name; dirty = true; updatePv(i, j); drawEditors();
}
function addW(i) { const ws = draft.days[i].workouts; ws.push({ id: uid(), sport: "run", name: "", durationMinutes: 0, distanceMeters: 0, humanReadable: "" }); dirty = true; drawCal(); openW(i, ws.length - 1); }
function delW(i, j) { draft.days[i].workouts.splice(j, 1); dirty = true; openIJ ? closeW() : drawCal(); }
function setW(i, j, f, v, el) {
  const w = draft.days[i].workouts[j];
  if (f === "distanceKm") w.distanceMeters = Math.round((+v || 0) * 1000);
  else if (f === "durationMinutes") w.durationMinutes = +v || 0;
  else w[f] = v;
  dirty = true;
  if (f === "sport") { el.closest(".ewo").className = "ewo s-" + v; if (v !== "run") delete w.steps; if (v !== "strength") delete w.exercises; drawEditors(); }
}
function pickAth(id) { if (!guard()) { renderPlan(); return; } cur = id; plan = null; loadPlan(); }
function shiftWeek(n) { if (!guard()) return; week = addDays(week, 7 * n); loadDraft(); renderPlan(); }
async function saveWeek() {
  try { plan = (await api("saveWeek", { id: cur, week: draft })).plan; loadDraft(); renderPlan(); toast("บันทึกสัปดาห์นี้แล้ว"); }
  catch (e) { toast(e.message, 1); }
}
function copyPrev() {
  const prev = plan?.weeks.find((w) => w.startDate === addDays(week, -7));
  if (!prev) return toast("สัปดาห์ก่อนยังไม่มีตาราง", 1);
  draft.phase = prev.phase; draft.focus = prev.focus;
  draft.days = prev.days.map((d, i) => ({ date: addDays(week, i), workouts: d.workouts.map((w) => ({ ...JSON.parse(JSON.stringify(w)), id: uid() })) }));
  dirty = true; renderPlan(); toast("คัดลอกแล้ว กด บันทึก เพื่อใช้งาน");
}
async function saveMeta() {
  try { plan = (await api("savePlanMeta", { id: cur, event: $("#pe").value, eventDate: $("#pd").value })).plan; toast("บันทึกแล้ว"); }
  catch (e) { toast(e.message, 1); }
}
async function delPlan() {
  if (!confirm("ลบแผนและประวัติการติ๊กทำแล้วของคนนี้ทั้งหมด? ย้อนกลับไม่ได้")) return;
  try { await api("deletePlan", { id: cur }); plan = null; loadDraft(); renderPlan(); toast("ลบแผนแล้ว"); } catch (e) { toast(e.message, 1); }
}
async function importFile(inp) {
  const f = inp.files[0]; inp.value = ""; if (!f) return;
  let data;
  try {
    const text = await f.text();
    const m = text.match(/<script[^>]*id=["']plan-data["'][^>]*>([\s\S]*?)<\/script>/);
    data = JSON.parse(m ? m[1] : text);
  } catch { return toast("อ่านไฟล์ไม่ได้ ใช้ไฟล์ .html จาก Claude Coach หรือ .json", 1); }
  if (!Array.isArray(data.weeks) || !data.weeks.length) return toast("ไม่พบข้อมูลสัปดาห์ในไฟล์", 1);
  if (plan && !confirm("แทนที่แผนเดิมของคนนี้ทั้งหมด? ประวัติติ๊กทำแล้วของเวิร์คเอาต์ที่รหัสตรงกันจะยังอยู่")) return;
  try {
    plan = (await api("importPlan", { id: cur, plan: { meta: data.meta, weeks: data.weeks } })).plan;
    week = plan.weeks.some((w) => w.startDate === mondayOf(todayStr())) ? mondayOf(todayStr()) : plan.weeks[0].startDate;
    loadDraft(); renderPlan(); toast(`นำเข้าแล้ว ${plan.weeks.length} สัปดาห์`);
  } catch (e) { toast(e.message, 1); }
}
async function sendNow() {
  if (dirty) return toast("กด บันทึก ก่อนส่ง", 1);
  const a = athletes.find((x) => x.id === cur);
  if (!confirm(`ส่งตาราง ${rangeLabel(week)} ให้ ${a.name} ทางอีเมลตอนนี้ ใช่ไหม?`)) return;
  try { await api("send", { id: cur, week }); toast("ส่งอีเมลแล้ว"); } catch (e) { toast(e.message, 1); }
}

window.addEventListener("beforeunload", (e) => { if (dirty) { e.preventDefault(); e.returnValue = ""; } });
pw ? boot() : renderLogin();
</script>
