name = "k4rcplan-cron"
main = "src/index.ts"
compatibility_date = "2024-09-23"

# อาทิตย์ 12:00 UTC = 19:00 เวลาไทย (เหมือน config เดิมบน Netlify)
[triggers]
crons = ["0 12 * * 0"]

[vars]
# แก้เป็นโดเมนจริงของเว็บหลังจากตั้งค่าโดเมนแล้ว (หรือใช้ *.pages.dev ชั่วคราวได้)
TARGET_URL = "https://k4rcplan.pages.dev/api/cron/weekly-send"

# ตั้งด้วย: wrangler secret put CRON_SECRET --config worker-cron/wrangler.toml
# ต้องเป็นค่าเดียวกับ CRON_SECRET ที่ตั้งใน Pages project env var
